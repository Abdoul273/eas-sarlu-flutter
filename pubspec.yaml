name: eas_sarlu
description: E.A.S Sarlu — gestion du magasin de matériaux de construction
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  # Traductions des composants Material/Cupertino (sélecteurs de date, etc.).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  flutter_local_notifications: ^17.2.1
  # 5.13.x figeait compileSdkVersion 30 côté Android, incompatible avec ses
  # propres dépendances AndroidX (qui exigent 34+) → build Gradle en échec.
  printing: ^5.15.0
  # share_plus 9 dépend de web ^0.5.0, incompatible avec printing >=5.13.2
  # qui exige web ^1.0.0. La série 10.x satisfait web ^1.0.0 tout en gardant
  # l'API Share.shareXFiles.
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  # Verrou local : déverrouillage par l'empreinte ou le visage déjà configurés
  # sur le téléphone. Le code à 6 chiffres reste le recours obligatoire —
  # la biométrie ne fait que l'abréger.
  local_auth: ^2.3.0
  # Lecture à voix haute des réponses de l'assistant, par le moteur de synthèse
  # du téléphone : aucune clé, aucun appel réseau, aucun quota. C'est le recours
  # garanti — il fonctionne hors ligne, ce qui arrive tous les jours ici.
  flutter_tts: ^4.2.5
  # Lecture des voix neuronales (Gemini TTS), qui arrivent en PCM brut et que le
  # moteur du téléphone ne sait pas jouer. Le naturel de ces voix vaut la
  # dépendance : une analyse de trésorerie énoncée par la synthèse d'Android
  # s'écoute comme un distributeur de billets.
  audioplayers: ^6.1.0
  # Empreinte du code de verrouillage (PBKDF2-HMAC-SHA256). Le code lui-même
  # n'est jamais écrit sur l'appareil.
  crypto: ^3.0.3
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  # file_picker 11 ne se compile pas avec la chaîne Android du projet
  # (GeneratedPluginRegistrant : symbole introuvable). La 8.1.4 fonctionne.
  file_picker: ^8.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

# Icônes reprises telles quelles de l'application web (dist/icone-*.png).
# Régénérer après toute modification :  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icone/icone-512.png"
  adaptive_icon_foreground: "assets/icone/icone-maskable-512.png"
  adaptive_icon_background: "#E85D04"
  min_sdk_android: 21
  # Les sources sont en RGBA ; iOS refuse toute transparence dans une icône.
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icone/icone-512.png"
    background_color: "#FFFFFF"
    theme_color: "#E85D04"
  windows:
    generate: true
    image_path: "assets/icone/icone-512.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icone/icone-512.png"
flutter:
  uses-material-design: true
  assets:
    - assets/icone/icone-512.png
    - assets/icone/icone-maskable-512.png